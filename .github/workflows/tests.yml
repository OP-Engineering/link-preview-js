name: Tests
on: pull_request

jobs:
  tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: jdx/mise-action@v5
        with:
          experimental: true
          version: 2026.5.16

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test
